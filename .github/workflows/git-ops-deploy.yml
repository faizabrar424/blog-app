name: GitOps Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4      

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/faizabrar424/blog-app:${{ steps.tag.outputs.tag }}
            ghcr.io/faizabrar424/blog-app:latest

      - name: Update GitOps repo
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/faizabrar424/blog-app-gitops.git
          cd blog-app-gitops

          sed -i "s|image: ghcr.io/faizabrar424/blog-app:.*|image: ghcr.io/faizabrar424/blog-app:${{ steps.tag.outputs.tag }}|" blog-app/deployment.yaml

          git config user.email "ci@github.com"
          git config user.name "GitHub CI"
          git commit -am "Deploy blog-app ${{ steps.tag.outputs.tag }}"
          git push
